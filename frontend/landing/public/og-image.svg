<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>GamCiv — Report public problems in The Gambia</title>
  <!-- Sky background -->
  <rect width="1200" height="630" fill="#EFF6FF"/>
  <!-- Royal blue institutional band -->
  <rect width="1200" height="16" fill="#1E40AF"/>

  <!-- Brand mark (same geometry as favicon) -->
  <g transform="translate(120 210) scale(3.2)">
    <rect width="48" height="48" rx="10.5" fill="#1E40AF"/>
    <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#FFFFFF" d="M 29.88 14.17 A 12 12 0 1 0 34.59 27.11"/>
      <path stroke="#22C55E" d="M 25.2 27.6 L 28.4 30.8 L 34.59 27.11"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="310" y="325" font-family="Lexend, 'Source Sans 3', Arial, Helvetica, sans-serif" font-size="112" font-weight="700" fill="#1E3A8A" letter-spacing="-3">GamCiv</text>

  <!-- Tagline -->
  <text x="314" y="398" font-family="'Source Sans 3', Arial, Helvetica, sans-serif" font-size="46" fill="#475569">Report public problems in The Gambia</text>

  <!-- Service line with green check -->
  <g transform="translate(314 448)">
    <path d="M 0 12 L 7 19 L 20 4" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="20" font-family="'Source Sans 3', Arial, Helvetica, sans-serif" font-size="30" fill="#1E40AF" font-weight="600">Reported. Routed. Resolved.</text>
  </g>

  <!-- Domain -->
  <text x="120" y="580" font-family="'Source Sans 3', Arial, Helvetica, sans-serif" font-size="26" fill="#6B8CAE">gamciv.pocketsoftware.dev</text>
</svg>
