# Deploys the site to the VPS on every push to main.
# Requires repo secrets: DEPLOY_SSH_KEY (private key), VPS_HOST (user@host)
# Set once via: gh secret set DEPLOY_SSH_KEY < keyfile   /   gh secret set VPS_HOST
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/app/package-lock.json
            frontend/dashboard/admin/package-lock.json
            frontend/landing/package-lock.json

      - name: Set up SSH
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          mkdir -p ~/.ssh && touch ~/.ssh/known_hosts
          ssh-keyscan -H "$VPS_HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_ADDR: ${{ secrets.VPS_HOST_ADDR }}

      - name: Build frontends with VPS Supabase configuration
        run: |
          set -eu
          export SSH="ssh -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -i /tmp/deploy_key $VPS_HOST"
          SUPABASE_URL=$($SSH 'sed -n "s/^SUPABASE_PUBLIC_URL=//p" /opt/supabase/docker/.env | head -1' | tr -d '"\r')
          ANON_KEY=$($SSH 'sed -n "s/^ANON_KEY=//p" /opt/supabase/docker/.env | head -1' | tr -d '"\r')
          test -n "$SUPABASE_URL"
          test -n "$ANON_KEY"
          export VITE_SUPABASE_URL="$SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$ANON_KEY"
          for d in frontend/app frontend/dashboard/admin frontend/landing; do
            echo "== building $d"
            (cd "$d" && npm ci && npm run build)
          done
          unset VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_URL ANON_KEY
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy to VPS
        run: |
          set -e
          export SSH="ssh -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -i /tmp/deploy_key $VPS_HOST"
          export SCP="scp -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=no -i /tmp/deploy_key"
          $SCP backend/db/0015_institution_dashboard.sql "$VPS_HOST:/tmp/0015_institution_dashboard.sql"
          $SSH "docker cp /tmp/0015_institution_dashboard.sql supabase-db:/tmp/0015_institution_dashboard.sql && docker exec -i supabase-db psql -U supabase_admin -d postgres -f /tmp/0015_institution_dashboard.sql && rm -f /tmp/0015_institution_dashboard.sql"
          # frontends: the nginx image bakes HTML at /usr/share/nginx/html — copy into
          # the running container and reload (the /opt/* staging dirs are scratch)
          $SSH "mkdir -p /opt/gamciv-app/html /opt/gamciv-dashboard/html /opt/gamciv-landing/html"
          $SCP -r frontend/app/dist/. "$VPS_HOST:/opt/gamciv-app/html/"
          $SCP -r frontend/dashboard/admin/dist/. "$VPS_HOST:/opt/gamciv-dashboard/html/"
          $SCP -r frontend/landing/dist/. "$VPS_HOST:/opt/gamciv-landing/html/"
          $SSH "docker cp /opt/gamciv-app/html/. gamciv-landing:/usr/share/nginx/html/app/ && docker cp /opt/gamciv-dashboard/html/. gamciv-landing:/usr/share/nginx/html/dashboard/ && docker cp /opt/gamciv-landing/html/. gamciv-landing:/usr/share/nginx/html/ && docker exec gamciv-landing nginx -s reload"
          # backend functions: rsync to the supabase functions volume and restart
          $SSH "mkdir -p /opt/supabase/docker/volumes/functions"
          $SCP -r backend/functions/. "$VPS_HOST:/opt/supabase/docker/volumes/functions/"
          $SSH "cd /opt/supabase/docker && docker compose restart functions"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
