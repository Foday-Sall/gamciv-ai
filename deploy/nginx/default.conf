# dashboard.pocketsoftware.dev — institutions' dashboard (dedicated domain).
# Added 2026-10-20: separate vhost so the dashboard has its own subdomain
# (protected by Cloudflare Access). The old gamciv /dashboard path redirects
# to this domain — see the default server below.
server {
    listen 80;
    server_name dashboard.pocketsoftware.dev;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (mirrors the default server; nginx does not merge
    # add_header across levels, so cacheable asset dirs repeat them) ---
    # CSP note: the pages load Google Fonts stylesheets and font files, so
    # fonts.googleapis.com / fonts.gstatic.com are allowed for style/font.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;

    # Bare root and bare /dashboard land on the dashboard app (login page).
    location = / { return 301 https://dashboard.pocketsoftware.dev/dashboard/; }
    location = /dashboard { return 301 https://dashboard.pocketsoftware.dev/dashboard/; }

    location ^~ /dashboard/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location ^~ /dashboard/ { try_files $uri $uri/ /dashboard/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}

# Default server: gamciv.pocketsoftware.dev (landing + officer app).
# NOTE: must be marked default_server explicitly — nginx would otherwise pick
# the FIRST server block on port 80 (the dashboard block above) as the default
# and gamciv's traffic would land in the dashboard vhost.
# The /dashboard path has moved to its own domain and is redirected there.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (added 2026-10-19 security hardening round 2) ---
    # NOTE: nginx does not merge add_header across levels; locations that set
    # their own add_header (the cacheable asset dirs) repeat these headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # CSP note: the pages load Google Fonts stylesheets and font files, so
    # fonts.googleapis.com / fonts.gstatic.com are allowed for style/font.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;

    location ^~ /app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location ^~ /app/ { try_files $uri $uri/ /app/index.html; }
    # Old dashboard path -> dedicated domain (preserves the full path).
    location ^~ /dashboard { return 301 https://dashboard.pocketsoftware.dev$request_uri; }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
