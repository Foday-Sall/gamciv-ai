# gamciv.pocketsoftware.dev — the only site vhost.
# The dashboard app (institutions' dashboard + administrator console) is
# served from the SAME origin at /dashboard/ — the dedicated
# dashboard.pocketsoftware.dev vhost is retired (2026-10-20). The single
# login page for everyone is /app/login: after signing in, role-based
# redirects send officers to /dashboard/institute and admins to /dashboard/.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects are relative (Location: /dashboard/): the container only sees
    # port 80 behind Cloudflare TLS, so absolute redirects would emit http://.
    absolute_redirect off;

    # --- Security headers (added 2026-10-19 security hardening round 2) ---
    # NOTE: nginx does not merge add_header across levels; locations that set
    # their own add_header (the cacheable asset dirs) repeat these headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # CSP note: the pages load Google Fonts stylesheets and font files, so
    # fonts.googleapis.com / fonts.gstatic.com are allowed for style/font.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;

    location ^~ /app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location ^~ /app/ { try_files $uri $uri/ /app/index.html; }

    # Dashboard app, same origin (was dashboard.pocketsoftware.dev). The
    # try_files fallback keeps deep links like /dashboard/institute alive.
    location ^~ /dashboard/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location = /dashboard { return 301 /dashboard/; }
    location ^~ /dashboard/ { try_files $uri $uri/ /dashboard/index.html; }

    # Legacy bookmarks: /admin used to live on its own subdomain.
    location = /admin { return 301 /dashboard/; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
