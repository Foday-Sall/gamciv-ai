# gamciv.pocketsoftware.dev — the only site vhost.
# The dashboard app (institution workspace + owner console) is served at /dash
# on this same origin. Everyone signs in at /app/login; the server-verified
# role decides which workspace is shown at the shared /dash URL.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects are relative (Location: /dash/): the container only sees
    # port 80 behind Cloudflare TLS, so absolute redirects would emit http://.
    absolute_redirect off;

    # --- Security headers (added 2026-10-19 security hardening round 2) ---
    # NOTE: nginx does not merge add_header across levels; locations that set
    # their own add_header (the cacheable asset dirs) repeat these headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # CSP note: the pages load Google Fonts stylesheets and font files, so
    # fonts.googleapis.com / fonts.gstatic.com are allowed for style/font.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;

    location ^~ /app/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location ^~ /app/ { try_files $uri $uri/ /app/index.html; }

    # Keep older cached dashboard assets available while old page URLs redirect.
    location ^~ /dashboard/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    # Canonical dashboard entry and SPA routes. Vite builds assets under /dash/.
    location = /dash { try_files /dash/index.html =404; }
    location ^~ /dash/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location ^~ /dash/ { try_files $uri $uri/ /dash/index.html; }

    # Legacy bookmarks continue to work, but all page requests land at /dash.
    location = /dashboard { return 301 /dash/; }
    location = /dashboard/ { return 301 /dash/; }
    location ^~ /dashboard/ { return 301 /dash/; }

    # Legacy bookmarks: /admin used to live on its own subdomain.
    location = /admin { return 301 /dash/; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.pocketsoftware.dev wss://api.pocketsoftware.dev; frame-ancestors 'none'" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
